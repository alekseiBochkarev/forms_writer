name: Daily rubrics experiment

on:
  schedule:
    # Эксперимент с рубриками: единый слот 13:00 UTC (16:00 МСК). Ротация
    # (rotation.py) выбирает два потока из пула {новые тесты, b, d, e, фото},
    # поэтому из матрицы запускаются только рубрики, попавшие в план на сегодня:
    # в день выходит 3 теста — эрудиция (daily.yml) плюс два потока из пула.
    # Ручной запуск (workflow_dispatch) ротацию игнорирует. Резервного cron нет:
    # второй запуск в тот же UTC-день заблокировал бы allow_publish_rubric и
    # только потратил бы раннер-время. При сбое — gh run rerun <id> --failed.
    - cron: "0 13 * * *"
  workflow_dispatch: {}  # позволяет запустить вручную из вкладки Actions

concurrency:
  group: daily-rubrics
  cancel-in-progress: false

jobs:
  # Рубрики b/d/e публикуются параллельно (matrix) и каждая коммитит общее
  # rubrics_state.json тем же паттерном, что и другие workflow (pull --rebase
  # --autostash + push). Ограничение «не чаще раза в UTC-день» — на рубрику
  # (allow_publish_rubric), поэтому разные рубрики в одном слоте допустимы.
  #
  # Резервного cron нет: второй запуск в тот же UTC-день заблокировал бы
  # allow_publish_rubric и только потратил бы раннер-время. При сбое —
  # gh run rerun <run-id> --failed (или перезапуск из вкладки Actions).
  #
  # Если захочется развести анонсы по времени, чтобы они не наслаивались в
  # Telegram, вынесите каждую рубрику в отдельный workflow со своим cron
  # (напр. b — 08:00, d — 11:00, e — 14:00 UTC): скопируйте job
  # create-rubric-forms, уберите strategy.matrix и подставьте конкретный id в
  # `--rubric`, поменяйте cron и concurrency.group.
  create-rubric-forms:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # b и e — фото-конвейер, d — смешанный выпуск. У «e» 15 кадров и 15
    # текстовых вопросов (много LLM-вызовов: сущности, дистракторы на каждую
    # сущность, тематические вопросы с запасом + фактчек), поэтому берём 90 мин.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        rubric: [b, d, e]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Ротация: в день выходит эрудиция (daily.yml) и два потока из пула,
      # поэтому из матрицы в конкретный день запускаются только нужные рубрики.
      # Ручной запуск (workflow_dispatch) ротацию игнорирует — это force.
      - name: Check daily rotation
        id: rotation
        run: |
          if python rotation.py --is-scheduled "rubric:${{ matrix.rubric }}"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Сегодня по ротации рубрика ${{ matrix.rubric }} не выходит — пропускаем."
            python rotation.py
          fi

      - name: Generate and publish rubric "${{ matrix.rubric }}" form
        if: github.event_name == 'workflow_dispatch' || steps.rotation.outputs.run == 'true'
        env:
          # --- секреты: модель и Яндекс Формы ---
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          YANDEX_FORMS_TOKEN: ${{ secrets.YANDEX_FORMS_TOKEN }}
          YANDEX_ORG_ID: ${{ secrets.YANDEX_ORG_ID }}
          # --- секреты: публикация анонса (необязательно) ---
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          # Единый канал для всех потоков (Variable важнее старого Secret).
          TG_TARGET_CHANNEL: ${{ vars.TG_TARGET_CHANNEL || vars.NEW_TESTS_TG_TARGET_CHANNEL || secrets.TG_TARGET_CHANNEL }}
          # --- обычные настройки (Settings -> Variables) ---
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://api.openai.com/v1' }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'gpt-4o-mini' }}
          # Фото-рубрикам и смешанному выпуску нужны источники изображений.
          # Рубрика «d» — советское кино, её кадры берутся только из ruwiki_film,
          # поэтому флаг включён жёстко: если Variable FILM_RU_ENABLED=false,
          # ежедневный выпуск «d» падал бы на выборе темы.
          FILM_RU_ENABLED: "true"
          FILM_GRAB_ENABLED: ${{ vars.FILM_GRAB_ENABLED || 'false' }}
          MOVIE_SCREENCAPS_ENABLED: ${{ vars.MOVIE_SCREENCAPS_ENABLED || 'false' }}
          WIKIMEDIA_USER_AGENT: ${{ vars.WIKIMEDIA_USER_AGENT }}
          PUBLISH: "true"
          SHUFFLE: "true"
          SHOW_RESULTS: "true"
          SHOW_CORRECT: "true"
          STATS: "true"
          RUBRIC: ${{ matrix.rubric }}
        run: python main.py --rubric "$RUBRIC"

      - name: Commit rubrics state
        if: github.event_name == 'workflow_dispatch' || steps.rotation.outputs.run == 'true'
        run: |
          git config user.name "daily-bot"
          git config user.email "daily-bot@users.noreply.github.com"
          git add rubrics_state.json || true
          git commit -m "Update rubrics state (${{ matrix.rubric }})" || echo "No changes"
          # Перед push проверяем, что rubrics_state.json валидный JSON.
          python -c "import json; json.load(open('rubrics_state.json', encoding='utf-8-sig'))" \
            || { echo "rubrics_state.json повреждён — push отменён"; exit 1; }
          # Защита от конфликтов matrix-джобов: перед push подтягиваем чужие
          # коммиты (свежие состояния других рубрик) и только потом пушим.
          git pull --rebase --autostash || true
          git push || echo "Nothing to push"

  # Отдельный job после матрицы: обновляем метрики свежих форм (число ответов,
  # correct_rate, wrong_pct) и коммитим их в rubrics_state.json. Отдельный
  # checkout даёт свежее состояние с уже опубликованными сегодня выпусками.
  metrics:
    runs-on: ubuntu-latest
    needs: create-rubric-forms
    # Метрики собираются каждый день, даже если сегодня по ротации рубрик не было
    # (jobs матрицы тогда skipped, а не failure).
    if: >-
      always() && needs.create-rubric-forms.result != 'failure'
      && needs.create-rubric-forms.result != 'cancelled'
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update rubric metrics
        env:
          YANDEX_FORMS_TOKEN: ${{ secrets.YANDEX_FORMS_TOKEN }}
          YANDEX_ORG_ID: ${{ secrets.YANDEX_ORG_ID }}
          RUBRIC_MIN_MEDIAN: ${{ vars.RUBRIC_MIN_MEDIAN || '50' }}
        run: python rubric_metrics.py

      - name: Commit rubrics state
        run: |
          git config user.name "daily-bot"
          git config user.email "daily-bot@users.noreply.github.com"
          git add rubrics_state.json || true
          git commit -m "Update rubrics state (metrics)" || echo "No changes"
          python -c "import json; json.load(open('rubrics_state.json', encoding='utf-8-sig'))" \
            || { echo "rubrics_state.json повреждён — push отменён"; exit 1; }
          git pull --rebase --autostash || true
          git push || echo "Nothing to push"
