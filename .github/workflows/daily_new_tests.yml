name: Daily new tests form

on:
  schedule:
    # Слот каждый день в 12:00 UTC (15:00 МСК). Выходит ли поток в этот день,
    # решает ротация (rotation.py): в день 3 теста — эрудиция + два потока из
    # пула. Ручной запуск (workflow_dispatch) ротацию игнорирует.
    - cron: "0 12 * * *"
    # Резервный запуск через 30 минут на случай сбоя основного.
    - cron: "30 12 * * *"
  workflow_dispatch: {}  # позволяет запустить вручную из вкладки Actions

concurrency:
  group: daily-new-tests
  cancel-in-progress: false

jobs:
  create-new-tests-form:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Бюджет LLM: генерация вопросов + вводная + заключительная + ревью
    # (плюс возможные регенерации). 120 * (1+1) * 3 = 12 мин на вопросы,
    # дополнительные вызовы укладываются в 30 мин.
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Ротация: в день выходит эрудиция (daily.yml) и два потока из пула.
      # Ручной запуск (workflow_dispatch) ротацию игнорирует — это force.
      - name: Check daily rotation
        id: rotation
        run: |
          if python rotation.py --is-scheduled new_tests; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Сегодня по ротации этот поток не выходит — пропускаем."
            python rotation.py
          fi

      - name: Generate and publish new tests form
        if: github.event_name == 'workflow_dispatch' || steps.rotation.outputs.run == 'true'
        env:
          # --- секреты: модель и Яндекс Формы ---
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          YANDEX_FORMS_TOKEN: ${{ secrets.YANDEX_FORMS_TOKEN }}
          YANDEX_ORG_ID: ${{ secrets.YANDEX_ORG_ID }}
          # --- секреты: публикация анонса (необязательно) ---
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          # Отдельный бот нового потока; если секрет не задан, main.py берёт
          # TG_BOT_TOKEN (см. NEW_TESTS_TG_BOT_TOKEN в config.py).
          NEW_TESTS_TG_BOT_TOKEN: ${{ secrets.NEW_TESTS_TG_BOT_TOKEN }}
          # --- обычные настройки (Settings -> Variables) ---
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://api.openai.com/v1' }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'gpt-4o-mini' }}
          # Канал нового потока: @username публичного канала или числовой id
          # приватного (-100…). По умолчанию — единый канал всех потоков
          # (TG_TARGET_CHANNEL), отдельная переменная — только для исключений.
          NEW_TESTS_ENABLED: "true"
          NEW_TESTS_COUNT: ${{ vars.NEW_TESTS_COUNT || '15' }}
          NEW_TESTS_PASS_SCORES: ${{ vars.NEW_TESTS_PASS_SCORES || '[10]' }}
          NEW_TESTS_TOPICS: ${{ vars.NEW_TESTS_TOPICS }}
          NEW_TESTS_TG_TARGET_CHANNEL: ${{ vars.NEW_TESTS_TG_TARGET_CHANNEL || vars.TG_TARGET_CHANNEL || secrets.TG_TARGET_CHANNEL || '@qa_helper_draft' }}
          NEW_TESTS_PUBLISH_TELEGRAM: "true"
          NEW_TESTS_STATE_FILE: "new_state.json"
          # Эксперимент для нового проекта: включить советское кино (ru.wikipedia).
          FILM_RU_ENABLED: ${{ vars.FILM_RU_ENABLED || 'true' }}
          # Вводная/заключительная и обязательное ревью.
          INTRO_ENABLED: "true"
          CONCLUSION_ENABLED: "true"
          REVIEW_ENABLED: "true"
          REVIEW_MAX_ATTEMPTS: ${{ vars.REVIEW_MAX_ATTEMPTS || '1' }}
          ANNOUNCE_INTRO: "true"
          PUBLISH: "true"
          SHUFFLE: "true"
          SHOW_RESULTS: "true"
          SHOW_CORRECT: "true"
          STATS: "true"
        run: python main.py --new-tests

      - name: Commit new tests state
        if: github.event_name == 'workflow_dispatch' || steps.rotation.outputs.run == 'true'
        run: |
          git config user.name "daily-bot"
          git config user.email "daily-bot@users.noreply.github.com"
          git add new_state.json || true
          git commit -m "Update new tests state" || echo "No changes"
          # Перед push проверяем, что new_state.json валидный JSON.
          python -c "import json; json.load(open('new_state.json', encoding='utf-8-sig'))" \
            || { echo "new_state.json повреждён — push отменён"; exit 1; }
          # Защита от конфликтов: перед push подтягиваем чужие коммиты.
          git pull --rebase --autostash || true
          git push || echo "Nothing to push"