name: Daily photo form

on:
  schedule:
    # Каждый день в 16:00 UTC (19:00 МСК) — на 10 часов позже эрудиционного выпуска.
    - cron: "0 16 * * *"
    # Резервный запуск через 30 минут на случай сбоя основного.
    - cron: "30 16 * * *"
  workflow_dispatch: {}  # позволяет запустить вручную из вкладки Actions

concurrency:
  group: daily-photo
  cancel-in-progress: false

jobs:
  create-photo-form:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Фото-поток делает много LLM-вызовов: ~15 при 10 вопросах
    # (сущности + дистракторы на каждую сущность), worst-case
    # ~15 × LLM_TIMEOUT × (LLM_RETRIES+1) + fallback-запросы поверх этого.
    # При дефолтах 15 × 120 × 2 = 3600 с ≈ 60 мин, поэтому 30 мин мало.
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate and publish photo form
        env:
          # --- секреты: модель и Яндекс Формы ---
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          YANDEX_FORMS_TOKEN: ${{ secrets.YANDEX_FORMS_TOKEN }}
          YANDEX_ORG_ID: ${{ secrets.YANDEX_ORG_ID }}
          # --- секреты: публикация анонса (необязательно) ---
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_TARGET_CHANNEL: ${{ secrets.TG_TARGET_CHANNEL }}
          VK_ACCESS_TOKEN: ${{ secrets.VK_ACCESS_TOKEN }}
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
          # --- обычные настройки (Settings -> Variables) ---
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://api.openai.com/v1' }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'gpt-4o-mini' }}
          PHOTO_FLOW_ENABLED: "true"
          PHOTO_SURVEY_NAME: "${{ vars.PHOTO_SURVEY_NAME || 'Что на фото' }}"
          PHOTO_QUESTIONS_COUNT: ${{ vars.PHOTO_QUESTIONS_COUNT || '10' }}
          # Темы и открытые источники можно переопределить через Variables.
          PHOTO_THEMES: ${{ vars.PHOTO_THEMES }}
          PHOTO_SOURCES: ${{ vars.PHOTO_SOURCES }}
          # Кино-источники: включаются владельцем через Variables (по умолчанию нет).
          FILM_RU_ENABLED: ${{ vars.FILM_RU_ENABLED || 'false' }}
          FILM_GRAB_ENABLED: ${{ vars.FILM_GRAB_ENABLED || 'false' }}
          MOVIE_SCREENCAPS_ENABLED: ${{ vars.MOVIE_SCREENCAPS_ENABLED || 'false' }}
          # Wikimedia требует описательный User-Agent — задайте в Variables.
          WIKIMEDIA_USER_AGENT: ${{ vars.WIKIMEDIA_USER_AGENT }}
          # Vision-проверка по умолчанию выключена.
          PHOTO_VISION_ENABLED: ${{ vars.PHOTO_VISION_ENABLED || 'false' }}
          PUBLISH: "true"
          PUBLISH_TELEGRAM: "true"
          PUBLISH_VK: "true"
        run: python main.py --photo

      - name: Commit photo state
        run: |
          git config user.name "daily-bot"
          git config user.email "daily-bot@users.noreply.github.com"
          git add photo_state.json || true
          git commit -m "Update photo state" || echo "No changes"
          # Защита от конфликтов: перед push подтягиваем чужие коммиты.
          git pull --rebase --autostash || true
          git push || echo "Nothing to push"